specVersion: 1.2.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: GnosisPaySpender
    network: gnosis
    source:
      address: "0xcff260bfbc199dc82717494299b1acade25f549b"
      abi: GnosisPaySpender
      startBlock: 35536000
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/spender.ts
      entities:
        - GnosisPaySpender
        - GnosisPaySafe
        - GnosisPayTransaction
      abis:
        - name: GnosisPaySpender
          file: ./abis/gnosis-pay-spender.json
        - name: SafeModule
          file: ./abis/safe-module.json
        - name: Erc20
          file: ./abis/erc20.json
        - name: Erc20Bytes
          file: ./abis/erc20-bytes.json
        - name: PriceOracle
          file: ./abis/price-oracle.json
      eventHandlers:
        - event: Spend(address,address,address,uint256)
          handler: handleSpend
      blockHandlers:
        - handler: handleOnce
          filter:
            kind: once
templates:
  - kind: ethereum
    name: GnosisPayToken
    network: gnosis
    source:
      abi: Erc20
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      file: ./src/transactions.ts
      entities:
        - Token
      abis:
        - name: Erc20
          file: ./abis/erc20.json
        - name: Erc20Bytes
          file: ./abis/erc20-bytes.json
        - name: PriceOracle
          file: ./abis/price-oracle.json
        - name: SafeModule
          file: ./abis/safe-module.json
      eventHandlers:
        - event: Transfer(indexed address,indexed address,uint256)
          handler: handleTransfer
