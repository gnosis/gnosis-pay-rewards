type GlobalState @entity {
  id: ID!
  startWeek: String!
  isInitialized: Boolean!
}

type Token @entity {
  # token address
  id: ID!
  address: Bytes!
  oracle: Bytes!
  chainId: Int!
  name: String!
  symbol: String!
  # token decimals
  decimals: BigInt!
}

enum TransactionType {
  SPEND
  REFUND
}

"""
A transaction for a safe
"""
type GnosisPayTransaction @entity {
  "The transaction hash"
  id: Bytes!
  "The safe that the transaction belongs to"
  safe: GnosisPaySafe!
  "The type of the transaction, either SPEND or REFUND"
  type: TransactionType!
  "The token that was transferred"
  token: Token!
  "Value of the transaction in the token's decimals, in wei"
  valueRaw: BigInt!
  "Value of the transaction in the token's decimals"
  value: BigDecimal!
  "Value of the transaction in USD, converted using the token's price at the time of the transaction"
  valueUsd: BigDecimal!
  "The estimated reward for the transaction, in GNO tokens"
  estimatedReward: BigDecimal!
  "The amount of GNO tokens that the user has in their wallet at the time of the transaction"
  gnoBalance: BigDecimal!
  blockNumber: Int!
  blockTimestamp: Int!
}

"""
The metrics for a safe for a week
"""
type GnosisPaySafeWeekSnapshot @entity {
  "The id is the week and the safe address in the format of <week>/<safeAddress>"
  id: String!
  safe: GnosisPaySafe!
  week: String!
  "The net USD volume for the week"
  netUsdVolume: BigDecimal!
  "The snapshots of the GNO balance for the week"
  gnoBalanceSnapshots: [GnosisTokenBalanceSnapshot!]!
  "The minimum GNO balance for the week"
  minGnoBalance: BigDecimal!
  "The maximum GNO balance for the week"
  maxGnoBalance: BigDecimal!
  transactions: [GnosisPayTransaction!]!
  transactionCount: Int!
}

"""
The metrics for a week
"""
type WeekMetrics @entity {
  "The id is the week in the format of YYYY-MM-DD where MM is the Sunday of the week OR null if the week is not yet known"
  id: String!
  "The week in the format of YYYY-MM-DD where MM is the Sunday of the week OR null if the week is not yet known"
  week: String!
  "The net USD volume for the week"
  netUsdVolume: BigDecimal!
  "The number of safe addresses that have been created in the week"
  transactions: [GnosisPayTransaction!]!
  transactionCount: Int!
}

type GnosisPaySafe @entity {
  id: String!
  address: Bytes!
  owners: [Bytes!]!
  isOg: Boolean!
  transactions: [GnosisPayTransaction!]! @derivedFrom(field: "safe")
  gnoBalanceSnapshots: [GnosisTokenBalanceSnapshot!]! @derivedFrom(field: "safe")
  rewards: [GnosisPayRewardDistribution!]! @derivedFrom(field: "safe")
}

type GnosisTokenBalanceSnapshot @entity {
  "The id is the block number and the safe address in the format of <blockNumber>/<safeAddress>"
  id: String!
  safe: GnosisPaySafe!
  "The week in the format of YYYY-MM-DD where MM is the Sunday of the week OR null if the week is not yet known"
  week: String
  "The balance of the safe, in wei"
  balanceRaw: BigInt!
  "The balance of the safe"
  balance: BigDecimal!
  blockNumber: Int!
  blockTimestamp: Int!
}

"""
A reward distribution for a safe
"""
type GnosisPayRewardDistribution @entity {
  id: Bytes!
  blockNumber: Int8!
  blockTimestamp: Int8!
  "The amount of GNO tokens that the user has in their wallet at the time of the transaction"
  amount: BigDecimal!
  "The amount of GNO tokens that the user has in their wallet at the time of the transaction, in raw format"
  amountRaw: BigInt!
  transactionHash: Bytes!
  safe: GnosisPaySafe!
  "The week in the format of YYYY-MM-DD where MM is the Sunday of the week OR null if the week is not yet known"
  week: String
}
