version: "3.8"

services:
  redis:
    image: redis:7-alpine
    container_name: gp-card-rewards-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - gp-card-rewards-network

  mongodb:
    image: mongo:7
    container_name: gp-card-rewards-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-replica-set.sh:/init-replica-set.sh
    command: mongod --replSet rs0 --noauth
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - gp-card-rewards-network

  mongodb-init:
    image: mongo:7
    container_name: gp-card-rewards-mongodb-init
    depends_on:
      mongodb:
        condition: service_healthy
    volumes:
      - ./init-replica-set.sh:/init-replica-set.sh
    entrypoint: ["/bin/bash", "/init-replica-set.sh"]
    networks:
      - gp-card-rewards-network

volumes:
  redis_data:
    driver: local
  mongodb_data:
    driver: local

networks:
  gp-card-rewards-network:
    driver: bridge
